{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} {% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>

    {% if messages %}
        <ul class="mensajes">
        {% for m in messages %}
            <li class="{{ m.tags }}">{{ m }}</li>
        {% endfor %}
        </ul>
    {% endif %}
   
    {% block content %}

    {% endblock %}
    
</body>
</html>
