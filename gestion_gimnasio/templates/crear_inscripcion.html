{% extends 'base.html' %}

{% block title %} crear inscripcion {% endblock %}

    {% block content%}
    <h1>Realizar inscripcion</h1>

    {% if mensaje %}
    <p>{{ mensaje }}</p>
    {% endif %}

    <form method="post">

        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit"> Inscribirse </button>

    </form>

    <a href="{% url 'perfil' %}">volver</a>


    {% endblock %}
